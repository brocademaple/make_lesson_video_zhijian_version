<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>any2video</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        background: #eceff3;
        color: #17202c;
      }

      .boot-panel {
        display: grid;
        place-content: center;
        min-height: 100dvh;
        gap: 8px;
        text-align: center;
      }

      .boot-title {
        font-size: 24px;
        font-weight: 700;
      }

      .boot-subtitle {
        color: #687386;
      }
    </style>
    <link rel="stylesheet" href="/assets/v2-styles.css?v=20260811-v04-kernel" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <div class="boot-panel">
        <div class="boot-title">any2video</div>
        <div class="boot-subtitle">正在打开本地视频工作台</div>
      </div>
    </div>
    <script>
      window.addEventListener("error", function (event) {
        var app = document.getElementById("app");
        if (!app || app.dataset.ready === "1") return;
        app.innerHTML =
          '<div class="boot-panel"><div class="boot-title">工作台加载失败</div><div class="boot-subtitle">' +
          String((event && event.message) || "请刷新页面后重试") +
          "</div></div>";
      });
    </script>
    <script src="/assets/v2-app.js?v=20260811-v04-kernel"></script>
  </body>
</html>
