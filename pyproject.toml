[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "any2video"
version = "0.4.0"
description = "any2video：把文字、图片、音频和课件素材组织为可渲染视频"
requires-python = ">=3.9"
dependencies = [
    "pillow>=10,<12",
    "python-pptx>=1.0.2,<2",
    "typer>=0.12,<1",
    "pydantic>=2,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "python-multipart>=0.0.9",
    "tinytag>=1.10,<2",
    "openai>=1.40,<2",
    "python-dotenv>=1.0,<2",
    "edge-tts>=7.0,<8",
]

[project.scripts]
any2video = "ppt_course_deal.cli:main"
ppt-course = "ppt_course_deal.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ppt_course_deal*", "ppt_course_rebuilder*"]

[tool.setuptools.package-data]
ppt_course_deal = [
    "static/*.html",
    "static/*.css",
    "static/*.js",
    "static/*.json",
    "minimax_t2a_allowlist.json",
    "transcript_rewrite/minimax_skill.md",
]
